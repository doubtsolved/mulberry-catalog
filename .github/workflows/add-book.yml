name: Ingest New Textbook

on:
  workflow_dispatch:
    inputs:
      drive_url:
        description: 'Google Drive Share Link'
        required: true
      title:
        description: 'Book Title'
        required: true
      author:
        description: 'Author / Faculty'
        required: false
        default: 'Medical Faculty'
      edition:
        description: 'Edition'
        required: false
        default: 'Standard Edition'
      prof:
        description: 'Academic Phase'
        required: true
        default: '1st Prof'
        type: choice
        options:
          - 1st Prof
          - 2nd Prof
          - 3rd Prof Part 1
          - Final Prof
      subject:
        description: 'Medical Subject'
        required: true
        default: 'Anatomy'
        type: choice
        options:
          - Anatomy
          - Physiology
          - Biochemistry
          - Pathology
          - Pharmacology
          - Microbiology
          - Forensic Medicine
          - Community Medicine
          - Ophthalmology
          - ENT
          - General Medicine
          - General Surgery
          - Obstetrics & Gynaecology
          - Paediatrics
          - Orthopaedics
          - Dermatology
          - Psychiatry
          - Radiology
          - Anaesthesiology
      book_type:
        description: 'Resource Type'
        required: true
        default: 'Standard Textbook'
        type: choice
        options:
          - Standard Textbook
          - Handwritten Notes
          - Review / High-Yield
          - Atlas / Practical
          - Question Bank (PYQ)
      extra_tags:
        description: 'Extra Tags (comma-separated, e.g., marrow, diagram, rapid)'
        required: false
        default: ''
      uploader:
        description: 'Contributor Name'
        required: false
        default: 'Sahabul'

permissions:
  contents: write

jobs:
  process-and-route:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mulberry-catalog
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install pymupdf gdown requests pillow cryptography

      - name: Run Ingestion Engine
        env:
          DRIVE_URL: ${{ github.event.inputs.drive_url }}
          BOOK_TITLE: ${{ github.event.inputs.title }}
          BOOK_AUTHOR: ${{ github.event.inputs.author }}
          BOOK_EDITION: ${{ github.event.inputs.edition }}
          BOOK_PROF: ${{ github.event.inputs.prof }}
          BOOK_SUBJECT: ${{ github.event.inputs.subject }}
          BOOK_TYPE: ${{ github.event.inputs.book_type }}
          EXTRA_TAGS: ${{ github.event.inputs.extra_tags }}
          UPLOADER_NAME: ${{ github.event.inputs.uploader }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          VAULT_ENCRYPTION_KEY: ${{ secrets.VAULT_ENCRYPTION_KEY }}
        run: |
          python scripts/process_book.py

      - name: Push Encrypted Payload to Vault Release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          TARGET_VAULT=$(cat target_vault.txt)
          echo "Target Vault Repository: $TARGET_VAULT"
          
          if ! gh release view v1-books --repo "$TARGET_VAULT" > /dev/null 2>&1; then
            echo "[*] Creating release v1-books in $TARGET_VAULT..."
            gh release create v1-books --repo "$TARGET_VAULT" --title "Medical Vault Assets" --notes "Encrypted payloads"
          fi
          
          gh release upload v1-books *.bin --repo "$TARGET_VAULT" --clobber
          echo "[✓] Encrypted asset uploaded successfully to $TARGET_VAULT"

      - name: Commit Updated Metadata & Cover
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          rm -f target_vault.txt *.bin *.pdf
          git add assets/covers/ catalog.json
          git commit -m "Cataloged: '${{ github.event.inputs.title }}' [${{ github.event.inputs.subject }}]" || echo "No changes to commit"
          git push origin main
